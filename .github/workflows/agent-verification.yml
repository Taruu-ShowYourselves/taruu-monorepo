name: Pull request verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Agent verification
    # A required check that cannot get a machine blocks every merge, which is
    # exactly what happened on 2026-08-06: hosted runners stopped being
    # allocated to this repo and #108 sat unmergeable behind a check that never
    # ran. Set CI_RUNS_ON to a JSON array of self-hosted labels to move this
    # onto our own machine; unset, it stays on ubuntu-latest.
    #
    # Read before setting it: this job checks out and executes pull-request
    # code. On a hosted runner that code gets a fresh VM that is destroyed
    # afterwards; on a self-hosted runner it runs on a box that persists
    # between jobs and belongs to us. That is an acceptable trade for a private
    # repo whose pull requests come from collaborators, and a bad one the day
    # this repo takes a pull request from a fork.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent evidence
        run: node scripts/agentic/check-evidence.mjs

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          # The build imports the browser Supabase client while prerendering.
          # Verification must not expose production credentials to PR code.
          NEXT_PUBLIC_SUPABASE_URL: https://verification.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: agent-verification-placeholder
        run: pnpm build
