name: Pull request verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taruu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Applies every migration to a throwaway database, then runs every file
      # in supabase/tests against it. These are the only checks that EXECUTE
      # the SQL this repository ships: before this job, supabase/tests ran
      # nowhere, and a migration's behaviour was verified by review alone.
      - name: Migrations + SQL behaviour
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/taruu_test
        run: ./scripts/db-test.sh

  verify:
    name: Agent verification
    # A required check that cannot get a machine blocks every merge, which is
    # exactly what happened on 2026-08-06: hosted runners stopped being
    # allocated to this repo and #108 sat unmergeable behind a check that never
    # ran. Set CI_RUNS_ON to a JSON array of self-hosted labels to move this
    # onto our own machine; unset, it stays on ubuntu-latest.
    #
    # Read before setting it: this job checks out and executes pull-request
    # code. On a hosted runner that code gets a fresh VM that is destroyed
    # afterwards; on a self-hosted runner it runs on a box that persists
    # between jobs and belongs to us. That is an acceptable trade for a private
    # repo whose pull requests come from collaborators, and a bad one the day
    # this repo takes a pull request from a fork.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent evidence
        run: node scripts/agentic/check-evidence.mjs

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          # The build imports the browser Supabase client while prerendering.
          # Verification must not expose production credentials to PR code.
          NEXT_PUBLIC_SUPABASE_URL: https://verification.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: agent-verification-placeholder
        run: pnpm build
