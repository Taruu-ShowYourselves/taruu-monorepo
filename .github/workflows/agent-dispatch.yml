name: Agent dispatch

# Work starts only when a maintainer asks for it in a comment. There is no
# board watcher and no label trigger: an item sitting in a project column, or
# carrying any label, never dispatches anything.
#
#   openclaw test   on a pull request -> read-only checks + UI screenshots,
#                                        reported back as one comment
#   openclaw work   on an issue       -> implement and open a pull request
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: >-
    agent-dispatch-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.run_id
    }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  dispatch-dolev:
    name: Dispatch to Dolev's OpenClaw
    # Comment commands route by the commenter; pull-request events route by the
    # sole assignee. The body guard keeps ordinary conversation from waking a
    # self-hosted runner at all — the dispatcher revalidates the command itself.
    if: >-
      (github.event.comment != null &&
       startsWith(github.event.comment.body, 'openclaw ') &&
       github.event.comment.user.login == vars.AGENT_OWNER_DOLEV) ||
      (github.event.comment == null &&
       github.event.pull_request.assignees[0].login == vars.AGENT_OWNER_DOLEV &&
       github.event.pull_request.assignees[1] == null)
    runs-on: [self-hosted, linux, x64, "${{ vars.AGENT_RUNNER_LABEL_DOLEV }}"]
    timeout-minutes: 5
    steps:
      # This intentionally does not check out or execute repository code. The
      # root-owned dispatcher is installed on the runner by the VM bootstrap.
      - name: Validate event and call the loopback OpenClaw hook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /usr/local/bin/taruu-agent-dispatch "$GITHUB_EVENT_PATH"

  dispatch-sahar:
    name: Dispatch to Sahar's OpenClaw
    if: >-
      (github.event.comment != null &&
       startsWith(github.event.comment.body, 'openclaw ') &&
       github.event.comment.user.login == vars.AGENT_OWNER_SAHAR) ||
      (github.event.comment == null &&
       github.event.pull_request.assignees[0].login == vars.AGENT_OWNER_SAHAR &&
       github.event.pull_request.assignees[1] == null)
    runs-on: [self-hosted, linux, x64, "${{ vars.AGENT_RUNNER_LABEL_SAHAR }}"]
    timeout-minutes: 5
    steps:
      # Each owner runner has a local fail-closed dispatcher configured for
      # exactly that owner. Repository code is never checked out here.
      - name: Validate event and call the loopback OpenClaw hook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /usr/local/bin/taruu-agent-dispatch "$GITHUB_EVENT_PATH"
