name: Deploy web (Cloudflare Workers)

# Builds apps/web with the OpenNext adapter and deploys the `taruu-web`
# Worker (taruu.co.il / www / api). Runtime secrets already live on the
# Worker (set via apps/web/scripts/sync-secrets.sh) and are preserved by
# `wrangler deploy`; CI only needs the Cloudflare deploy credential plus
# the NEXT_PUBLIC_* values that Next inlines at build time.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  # CI deploy is OPTIONAL: the canonical release path is the manual
  # `pnpm run deploy` from apps/web (wrangler OAuth). Without the
  # CLOUDFLARE_API_TOKEN secret the deploy job skips grey - no failure,
  # no notification. If the secret ever lands, CI takes over automatically.
  #
  # Where these jobs run is a repo variable, not a constant. GitHub stopped
  # allocating hosted runners to this repo on 2026-08-06 - three jobs across
  # two workflows died on "The job was not acquired by Runner of type hosted
  # even after multiple attempts" while the status page read all-operational -
  # and a release path that only knows one kind of machine has no answer to
  # that. Set CI_RUNNER_LABEL to a label on the self-hosted runner (see
  # `gh api /repos/:owner/:repo/actions/runners`) to move the work there;
  # unset it to go back to ubuntu-latest. No workflow edit either way.
  guard:
    runs-on: ${{ vars.CI_RUNNER_LABEL && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.CI_RUNNER_LABEL)) || 'ubuntu-latest' }}
    outputs:
      deployable: ${{ steps.check.outputs.deployable }}
    steps:
      - id: check
        run: echo "deployable=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    if: needs.guard.outputs.deployable == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL && fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.CI_RUNNER_LABEL)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          # Wrangler v4 requires Node >= 22.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext → Cloudflare)
        working-directory: apps/web
        env:
          # NEXT_PUBLIC_* are inlined at build time, not read at runtime.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: pnpm cf:build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Notify the linked PR and issue
        if: always()
        # Best-effort garnish: comment/Telegram posting must never fail a run
        # whose actual deploy succeeded (org policy 403s the workflow token on
        # issue comments).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          node scripts/agentic/notify-deployment.mjs
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --outcome "${{ job.status }}"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --url "https://taruu.co.il"
